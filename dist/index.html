const DATA = {"titles":{"1":"هندسة ما وراء المعرفة المطبقة على الحركة المهنية","2":"الأندراغوجيا وموقف المكوِّن إزاء جمهور من الراشدين","3":"المواءمة البيداغوجية الموجهة بالكفايات (APC)","4":"تدبير الحمل المعرفي في سياق تقني/حركي","5":"تقنيات الاستجواب لتحليل الممارسة المهنية","6":"نقل التعلمات نحو منصب العمل","7":"التمايز البيداغوجي إزاء تباين المسارات","8":"البيداغوجيا باللعب المطبقة على الكفايات السلوكية والتقنية","9":"الإدماج وإمكانية الولوج في مركز التكوين المهني","10":"موقف المكوِّن التأملي إزاء ممارسته في الورشة/المركز","11":"السيناريو البيداغوجي الرابط بين النظرية والممارسة","12":"الحياد والموقف الأخلاقي للمكوِّن إزاء واقع عالم الشغل"},"qs":[{"src":"o","ax":1,"n":1,"q":"تُعرِّف ما وراء المعرفة أساسًا بأنها :","o":["الدافعية الذاتية","حفظ الإجراءات","التعلم بالتقليد","معرفة النشاط المعرفي الخاص بالفرد وتنظيمه"],"a":3,"e":"يعرفها فلافيل بأنها معرفة الفرد بعملياته الذهنية والتحكم فيها."},{"src":"o","ax":1,"n":2,"q":"من هو المؤلف الذي أدخل مفهوم ما وراء المعرفة في سبعينيات القرن العشرين ؟","o":["فلافيل","سكينر","نولز","بياجيه"],"a":0,"e":"جون فلافيل (1976) هو مؤسس هذا المفهوم."},{"src":"o","ax":1,"n":3,"q":"المكونان الرئيسيان لما وراء المعرفة هما :","o":["المعرفة والسلوك","التقييم والتصديق","المعارف الميتامعرفية والتنظيم (التحكم)","الذاكرة والانتباه"],"a":2,"e":"نميز بين المعرفة حول الإدراك الذاتي وبين توجيهه."},{"src":"o","ax":1,"n":4,"q":"عند فلافيل، تخص المعارف الميتامعرفية :","o":["الأدوات والآلات والمواد","المكوِّن والمتعلم والمؤسسة","المعرفة والمهارة والسلوك","الشخص والمهمة والاستراتيجية"],"a":3,"e":"هذه هي المتغيرات الثلاثة الكلاسيكية عند فلافيل."},{"src":"o","ax":1,"n":5,"q":"المراحل الثلاث للتنظيم الميتامعرفي هي :","o":["القراءة والكتابة والحساب","التحفيز والإخبار والعقاب","الملاحظة والتقليد والتكرار","التخطيط والمراقبة (التتبع) والتقييم"],"a":3,"e":"قبل الفعل وأثناءه وبعده."},{"src":"o","ax":1,"n":6,"q":"عند تطبيقها على الحركة المهنية، تهدف ما وراء المعرفة أساسًا إلى :","o":["إلغاء الخطأ في الورشة","جعل المتعلم واعيًا بالكيفية التي ينجز بها حركته ويعدل function pick(){
  const axes = cfg.axes || Object.keys(DATA.titles).map(Number);
  let pool = allQ().filter(q => axes.includes(q.ax) && (cfg.src==='all' || q.src===cfg.src));
  const sc = q => { const s=stats[q.id]; if(!s) return 2+Math.random(); const net=s.c-s.w; return (s.w>s.c||s.last===0)? 3+Math.random()*2 : (net>=2? Math.random()*0.8 : 1+Math.random()) };
  if(cfg.order==='weak') pool = pool.filter(q => stats[q.id] && (stats[q.id].w>0 && stats[q.id].c<=stats[q.id].w+1));
  if(cfg.order==='smart' || cfg.order==='weak') pool = pool.map(q=>[sc(q),q]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  else if(cfg.order==='rand') pool = shuffle(pool);
  else pool = pool.sort((a,b)=>a.ax-b.ax||(a.id>b.id?1:-1));
  pool = pool.slice(0, cfg.count);
  if(cfg.order!=='seq') pool = shuffle(pool);
  return pool;
}
function start(retry){
  const pool = retry || pick();
  if(!pool.length){ alert('لا توجد أسئلة تطابق اختيارك (غيّر المحاور أو المصدر أو النمط).'); return }
  const items = pool.map(q=>{ const order = shuffle([0,1,2,3]); return {q, order, sel:null, done:false, timeout:false, t:0} });
  S = {items, i:0, t0:Date.now(), locked: cfg.feedback==='now' || cfg.timer==='per', timer:cfg.timer, total:cfg.total*60, per:cfg.per, deadline:null, qDeadline:null, finished:false};
  if(S.timer==='total') S.deadline = Date.now()+S.total*1000;
  show(0);
}

/* ---------------- QUIZ ---------------- */
function show(i){
  view='quiz'; S.i=i; const it=S.items[i];
  if(S.timer==='per' && !it.done) S.qDeadline = Date.now()+S.per*1000;
  it.shownAt = Date.now();
  draw();
  clearInterval(tick); tick=setInterval(onTick,250); onTick();
}
function draw(){
  const it=S.items[S.i], q=it.q, n=S.items.length;
  const revealed = it.done && (cfg.feedback==='now');
  const opts = it.order.map((oi,pos)=>{
    let cls='opt';
    if(revealed){ if(oi===q.a) cls+=' ok'; else if(it.sel===oi) cls+=' no' }
    else if(it.sel===oi) cls+=' sel';
    return `<button class="${cls}" ${(S.locked&&it.done)?'disabled':''} onclick="choose(${oi})"><span class="l">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join('');
  const lastQ = S.i===n-1;
  $('#app').innerHTML = `
  <div class="card">
    <div class="top"><span class="mut">سؤال <b>${S.i+1}</b> / ${n}</span><span class="qtag">م${q.ax} – ${esc(DATA.titles[q.ax]||'أسئلتي')}</span><span id="tm" class="timer ${S.timer==='none'?'hide':''}"></span></div>
    <div class="bar" style="margin:8px 0"><i style="width:${100*S.items.filter(x=>x.done||x.sel!==null).length/n}%"></i></div>
    <div class="q">${esc(q.q)}</div>
    ${opts}
    ${revealed ? `<div class="exp ${it.sel===q.a?'':'w'}"><b>${it.timeout?'⏱ انتهى الزمن. ':(it.sel===q.a?'✔ إجابة صحيحة. ':'✘ إجابة خاطئة. ')}</b>الجواب الصحيح: <b>${L[it.order.indexOf(q.a)]}) ${esc(q.o[q.a])}</b>${q.e?`<br><span class="mut">التبرير:</span> ${esc(q.e)}`:''}</div>`:''}
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <div class="row">
        ${!S.locked?`<button class="btn sec" onclick="show(${Math.max(0,S.i-1)})" ${S.i===0?'disabled':''}>→ السابق</button>`:''}
        <button class="btn" onclick="next()" ${(S.locked&&!it.done)?'disabled':''}>${lastQ?'إنهاء ✓':'التالي ←'}</button>
        ${S.locked&&!it.done?`<button class="btn sec" onclick="skip()">تخطّي</button>`:''}
      </div>
      <button class="btn red" onclick="if(confirm('إنهاء الجلسة الآن؟'))finish()">إنهاء</button>
    </div>
    ${!S.locked?`<div class="pal">${S.items.map((x,k)=>`<button class="${x.sel!==null?'a':''} ${k===S.i?'c':''}" onclick="show(${k})">${k+1}</button>`).join('')}</div>`:''}
    <div class="mut" style="margin-top:8px">اختصارات: 1–4 للاختيار · Enter للتالي</div>
  </div>`;
}
function choose(oi){
  const it=S.items[S.i]; if(S.locked && it.done) return;
  it.sel=oi; it.t=(Date.now()-it.shownAt)/1000;
  if(S.locked){ it.done=true; if(cfg.feedback==='now') record(it) }
  draw(); onTick();
}
function skip(){ const it=S.items[S.i]; it.done=true; it.timeout=false; if(cfg.feedback==='now') record(it); next() }
function next(){ if(S.i<S.items.length-1) show(S.i+1); else finish() }
function record(it){
  if(it.rec) return; it.rec=true;
  const s = stats[it.q.id] || (stats[it.q.id]={c:0,w:0,last:null});
  const ok = it.sel===it.q.a; if(ok) s.c++; else s.w++; s.last = ok?1:0;
  save(LS_STATS,stats);
}
function onTick(){
  const tm=$('#tm'); if(!S||view!=='quiz') return;
  if(S.timer==='total'){
    const left=(S.deadline-Date.now())/1000; if(tm){ tm.textContent='⏱ '+fmt(left); tm.classList.toggle('low',left<60) }
    if(left<=0){ clearInterval(tick); alert('انتهى الوقت المخصّص للجلسة.'); finish() }
  } else if(S.timer==='per'){
    const it=S.items[S.i];
    if(it.done){ if(tm) tm.textContent='✓'; return }
    const left=(S.qDeadline-Date.now())/1000; if(tm){ tm.textContent='⏱ '+fmt(left); tm.classList.toggle('low',left<=10) }
    if(left<=0){ it.done=true; it.timeout=true; if(cfg.feedback==='now'){ record(it); draw() } else { next() } }
  }
}
document.addEventListener('keydown',e=>{
  if(view!=='quiz'||!S||e.target.matches('input,textarea,select')) return;
  const it=S.items[S.i];
  if(e.key>='1'&&e.key<='4'){ choose(it.order[+e.key-1]) }
  else if(e.key==='Enter'){ if(!(S.locked&&!it.done)) next() }
});

/* ---------------- FINISH ---------------- */
function finish(){
  clearInterval(tick); view='result';
  let right=0, wrong=0, blank=0; const byAx={};
  S.items.forEach(it=>{
    if(!it.rec && it.sel!==null && cfg.feedback==='end') record(it);
    const a=it.q.ax; byAx[a]=byAx[a]||{r:0,n:0}; byAx[a].n++;
    if(it.sel===null) blank++; else if(it.sel===it.q.a){ right++; byAx[a].r++ } else wrong++;
  });
  const n=S.items.length, pct=Math.round(100*right/n), secs=Math.round((Date.now()-S.t0)/1000);
  hist.push({d:Date.now(),n,right,pct,secs}); hist=hist.slice(-200); save(LS_HIST,hist);
  const msg = pct>=80?'🏆 ممتاز! أنت في مستوى النجاح المستهدف.':pct>=60?'👍 جيد، واصل مراجعة نقاط الضعف.':'💪 تحتاج مزيدًا من المراجعة، ركّز على المحاور الأضعف.';
  const bad = S.items.filter(it=>it.sel!==it.q.a);
  $('#app').innerHTML = `
  <div class="card"><div class="score">${pct}%</div>
    <div style="text-align:center"><b>${right}</b> صحيحة · <b>${wrong}</b> خاطئة · <b>${blank}</b> بلا جواب · المدة ${fmt(secs)}<br>${msg}</div>
    <div class="row" style="justify-content:center;margin-top:12px">
      <button class="btn" onclick="home()">القائمة الرئيسية</button>
      ${bad.length?`<button class="btn sec" onclick="start(S.items.filter(it=>it.sel!==it.q.a).map(it=>it.q))">🔁 أعد الأسئلة الخاطئة (${bad.length})</button>`:''}
      <button class="btn sec" onclick="start(pick())">جلسة جديدة بنفس الإعدادات</button></div></div>
  <div class="card"><h2>النتيجة بحسب المحور</h2>${Object.keys(byAx).sort((a,b)=>a-b).map(a=>{const p=Math.round(100*byAx[a].r/byAx[a].n);return `<div class="ax"><div>م${a} – ${esc(DATA.titles[a]||'أسئلتي')}<div class="bar"><i style="width:${p}%;background:${p>=80?'var(--ok)':p>=50?'var(--pri)':'var(--bad)'}"></i></div></div><b>${byAx[a].r}/${byAx[a].n}</b></div>`}).join('')}</div>
  <div class="card"><h2>مراجعة كل الأسئلة</h2>
    ${S.items.map((it,k)=>{const q=it.q, ok=it.sel===q.a; return `<div class="rev"><span class="tag ${ok?'ok':'no'}">${it.sel===null?'بلا جواب':ok?'صحيح':'خاطئ'}</span> <span class="mut">م${q.ax} · س${k+1}</span><div><b>${esc(q.q)}</b></div>
      ${it.sel!==null&&!ok?`<div style="color:var(--bad)">إجابتك: ${esc(q.o[it.sel])}</div>`:''}
      <div style="color:var(--ok)">الصحيح: ${esc(q.o[q.a])}</div>${q.e?`<div class="mut">${esc(q.e)}</div>`:''}</div>`}).join('')}</div>`;
}

/* ---------------- PROGRESS ---------------- */
function progress(){
  const Q=allQ(), rows=Object.keys(DATA.titles).map(a=>{
    const qa=Q.filter(q=>q.ax==a); let c=0,w=0,seen=0;
    qa.forEach(q=>{const s=stats[q.id]; if(s){seen++;c+=s.c;w+=s.w}});
    return {a,tot:qa.length,seen,acc:c+w?Math.round(100*c/(c+w)):null}});
  $('#app').innerHTML=`<h1>📊 تقدّمي</h1><div class="card">${rows.map(r=>`<div class="ax"><div>م${r.a} – ${esc(DATA.titles[r.a])}<div class="bar"><i style="width:${r.acc||0}%;background:${(r.acc||0)>=80?'var(--ok)':'var(--pri)'}"></i></div><span class="mut">شاهدتَ ${r.seen}/${r.tot} سؤالًا</span></div><b>${r.acc===null?'—':r.acc+'%'}</b></div>`).join('')}</div>
  ${hist.length?`<div class="card"><h2>آخر الجلسات</h2>${hist.slice(-10).reverse().map(h=>`<div class="mut">${new Date(h.d).toLocaleString('ar-MA')} — ${h.right}/${h.n} (${h.pct}%) — ${fmt(h.secs)}</div>`).join('')}</div>`:''}
  <button class="btn" onclick="home()">← رجوع</button>`;
}

/* ---------------- ADD OWN QUESTIONS ---------------- */
function addForm(){
  view='add';
  $('#app').innerHTML=`<h1>➕ أسئلتي</h1>
  <div class="card"><h2>سؤال جديد</h2>
   <select id="f_ax" class="w">${Object.keys(DATA.titles).map(a=>`<option value="${a}">م${a} – ${esc(DATA.titles[a])}</option>`).join('')}</select>
   <textarea id="f_q" rows="2" placeholder="نص السؤال" style="margin-top:8px"></textarea>
   ${[0,1,2,3].map(i=>`<div class="row" style="margin-top:6px"><input type="radio" name="f_a" value="${i}" ${i===0?'checked':''}><input class="w" id="f_o${i}" type="text" placeholder="الخيار ${L[i]}" style="flex:1"></div>`).join('')}
   <div class="mut">حدّد دائرة الجواب الصحيح.</div>
   <textarea id="f_e" rows="2" placeholder="تبرير (اختياري)" style="margin-top:8px"></textarea>
   <div class="row" style="margin-top:8px"><button class="btn" onclick="saveQ()">حفظ السؤال</button><button class="btn sec" onclick="home()">← رجوع</button></div></div>
  <div class="card"><h2>أسئلتي (${userQ.length})</h2>
   ${userQ.map((q,i)=>`<div class="rev"><span class="mut">م${q.ax}</span> ${esc(q.q)} <button class="chip" onclick="delQ(${i})">حذف</button></div>`).join('')||'<div class="mut">لا توجد أسئلة بعد.</div>'}
   <div class="row" style="margin-top:8px"><button class="btn sec" onclick="expQ()">تصدير (JSON)</button><button class="btn sec" onclick="document.getElementById('imp').click()">استيراد</button><input id="imp" type="file" accept=".json" class="hide" onchange="impQ(this)"></div></div>`;
}
function saveQ(){
  const q=$('#f_q').value.trim(), o=[0,1,2,3].map(i=>$('#f_o'+i).value.trim());
  if(!q||o.some(x=>!x)){ alert('أكمل نص السؤال والخيارات الأربعة.'); return }
  userQ.push({id:Date.now(),ax:+$('#f_ax').value,q,o,a:+document.querySelector('input[name=f_a]:checked').value,e:$('#f_e').value.trim()});
  save(LS_USER,userQ); addForm();
}
function delQ(i){ if(confirm('حذف هذا السؤال؟')){ userQ.splice(i,1); save(LS_USER,userQ); addForm() } }
function expQ(){ const b=new Blob([JSON.stringify(userQ,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='my_questions.json'; a.click() }
function impQ(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const arr=JSON.parse(r.result); arr.forEach(x=>{ if(x.q&&Array.isArray(x.o)&&x.o.length===4&&x.a>=0&&x.a<4) userQ.push({id:Date.now()+Math.random(),ax:x.ax||1,q:x.q,o:x.o,a:x.a,e:x.e||''}) }); save(LS_USER,userQ); addForm() }catch(e){ alert('ملف غير صالح') } }; r.readAsText(f) }

home();
</script>
</body>
</html>
